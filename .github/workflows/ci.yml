name: CI Verification Pipeline

on:
  push:
    branches:
      - main
      - phase-2
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - phase-2

jobs:
  quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Repository Safety & Secrets
        run: npm run check:repo

      - name: Check File Line Length Limit (Max 600)
        run: npm run check:lines

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compiler Check
        run: npm run typecheck

      - name: Run Vitest Unit Tests & Coverage
        run: npm run test:coverage

      - name: Build Production Bundle
        run: npm run build

  database:
    name: Database Security & Live pgTAP Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Static Database Security Assertions
        run: npm run test:db:static

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Disposable Supabase Database Engine
        run: supabase start

      - name: Apply Migrations & Seed Schema
        run: supabase db reset

      - name: Run Live pgTAP Test Suite
        run: supabase test db

  e2e:
    name: Browser E2E & A11y Verification
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storefront for Production Preview
        run: npm run build

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Run Axe-core Accessibility Audits
        run: npm run test:a11y

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
